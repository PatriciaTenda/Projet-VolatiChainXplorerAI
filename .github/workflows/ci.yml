name: Test CI - VolatiChainXplorerAI
on:
    push:
      branches:
        - main
    pull_request:
      branches:
        - main
permissions:
    contents: read

jobs:
    test:
        runs-on: ubuntu-latest

        env:
            JWT_SECRET_KEY: "ci_only_secret_key_not_for_production_123456789"
            URL: "postgresql://ci_user:ci_password@localhost:5432/ci_database"
            POSTGRES_USER: "ci_user"
            POSTGRES_PASSWORD: "ci_password"
            POSTGRES_DB: "ci_database"
            POSTGRES_HOST: "localhost"
            POSTGRES_PORT: "5432"

        steps:
            - name: Checkout du code
              uses: actions/checkout@v7

            - name: Setup python
              uses: actions/setup-python@v7
              with:
                python-version: "3.12.9"
                cache: pip
                cache-dependency-path: requirements-ci.txt

            - name: Install dependencies
              run: |
                python -m pip install --upgrade pip
                pip install -r requirements-ci.txt

            - name: Run tests
              run:  python -m pytest -m "not integration" -v