groups:
  - name: prediction_alerts

    rules:
      - alert: PredictionInputDataTooOld

        expr: |
          max by (horizon) (
            volatichainxplorerai_input_data_age_days
          ) > 7

        for: 1m

        labels:
          severity: warning
          service: prediction

        annotations:
          summary: "Données de prédiction trop anciennes"

          description: >-
            Les données utilisées pour la prédiction à
            {{ $labels.horizon }} jours ont une ancienneté
            de {{ $value }} jours.