#  Version de la syntaxe Docker Compose
# version: "3.9"

#  Définition des services (conteneurs)
services:

  #  Service PostgreSQL
  postgres:
    image: postgres:16  #  Version la plus stable de postgresSQL
    container_name: VolatiChainXplorerAI_postgres
    restart: always
    env_file:
      - .env                #  Charger les variables d’environnement depuis le fichier .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}          #  username
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}  #  password
      POSTGRES_DB: ${POSTGRES_DB}              #  database name
    ports:
      - "5433:5432"         #  Expose le port PostgreSQL localement
    volumes:
      - postgres_data:/var/lib/postgresql/data  #  Volume persistant

  #  Service MongoDB
  mongo:
    image: mongo:6
    container_name: mongo_VolatiChainXplorerAI
    restart: always
    env_file:
      - .env
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DB}
    ports:
      - "27017:27017"       #  Port MongoDB par défaut
    volumes:
      - mongo_data:/data/db #  Volume persistant 
      
      
  #  Service Prometheus
  prometheus:
    image: prom/prometheus:latest
    container_name: VolatiChainXplorerAI_prometheus
    ports: 
      - "9090:9090"          #  Port Prometheus par défaut
    restart: always
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus #  Volume persistant Prometheus

    depends_on:
      - alertmanager

#  Service Grafana destiné à visualiser les métriques Prometheus  
  grafana:
    image: grafana/grafana:latest
    container_name: VolatiChainXplorerAI_grafana
    ports:
      - "3000:3000"
    restart: always
    volumes:
      - grafana_data:/var/lib/grafana  #  Volume persistant Grafana
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro

    depends_on:
      - prometheus

  #  Service Alertmanager pour gérer les alertes Prometheus
  alertmanager:
    image: prom/alertmanager:latest
    container_name: VolatiChainXplorerAI_alertmanager
    restart: always

    ports:
      - "9093:9093"

    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager

    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"

    secrets:
      - discord_webhook_url


      
#  Déclaration des volumes pour persister les données même si le conteneur est supprimé
volumes:
  postgres_data:
  mongo_data:
  prometheus_data:
  grafana_data:
  alertmanager_data:


secrets:
  discord_webhook_url:
    environment: "DISCORD_WEBHOOK_URL_VOLATICHAINXPLORERAI"
